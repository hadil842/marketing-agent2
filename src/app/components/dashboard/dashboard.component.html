<div class="dashboard-container">
  <div class="dashboard-header">
    <h1>DashBoard</h1>
    <p>{{ clientsCount }} Clients Saved</p>
    <button (click)="goToUpload()">Upload a new Excel file</button>
  </div>

  <div *ngIf="isLoading">Loading ...</div>
  <div *ngIf="errorMessage" class="error">{{ errorMessage }}</div>

  <table *ngIf="!isLoading && campaigns.length > 0">
    <thead>
      <tr>
        <th>Client</th>
        <th>Email</th>
        <th>Date</th>
        <th>Description</th>
        <th>State</th>
        <th>Actions</th>
      </tr>
    </thead>
    <tbody>
  <tr *ngFor="let campaign of campaigns" [class.row-annule]="campaign.etat === 'annulé'">
    <td>{{ campaign.nomClient }}</td>
    <td>{{ campaign.emailclient }}</td>
    <td>{{ campaign.date | date:'short' }}</td>
    <td>{{ campaign.description }}</td>
    <td>{{ campaign.etat }}</td>
    <td>
      <button 
        (click)="cancelPost(campaign.id)" 
        [disabled]="campaign.etat === 'annulé'">
        {{ campaign.etat === 'Cancelled' ? 'Cancelled' : 'Cancel' }}
      </button>
    </td>
  </tr>
</tbody>
  </table>

  <div *ngIf="!isLoading && campaigns.length === 0 && !errorMessage">
    No comapny available Now.
  </div>
</div>
